[package]
name = "readout-gui"
version.workspace = true
edition.workspace = true

[dependencies]
readout-core = { workspace = true }
readout-io = { workspace = true }
readout-persistence = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
eframe = "0.33"
egui = "0.33"
egui_plot = "0.34"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
rodio = { version = "0.22", optional = true }
rfd = "0.15"
chrono = "0.4"
egui-phosphor = { version = "0.11", features = ["regular", "bold"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
default = ["audio"]
audio = ["rodio"]

[package.metadata.bundle]
name = "readOut"
identifier = "xyz.vaclavik.readout"
icon = ["assets/readout.icns"]
category = "public.app-category.utilities"
short_description = "Real-time measurement dashboard for SCPI multimeters and USB-C power meters"
copyright = "Copyright (c) 2025 Filip Vaclavik"
osx_minimum_system_version = "13.0"
